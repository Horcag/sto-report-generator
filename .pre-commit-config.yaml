default_install_hook_types: [pre-commit, pre-push]
exclude: ^\.agents/skills/humanizer-ru/

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.6.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-added-large-files
          - id: check-json
          - id: check-yaml
          - id: check-toml

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint
            files: ^\.github/workflows/.*\.ya?ml$

    - repo: local
      hooks:
          - id: prettier
            name: Prettier staged files
            entry: npx prettier --write
            language: system
            files: ^((src|tests)/.*\.(ts|json)|docs/.*\.md|tests/.*\.md|README\.md|package\.json|tsconfig\.json|eslint\.config\.mjs|steiger\.config\.ts|\.prettierrc|\.pre-commit-config\.yaml|\.github/.*\.yml|sonar-project\.properties)$
            exclude: ^(node_modules/|reports/|output/|research/|\.agents/skills/docx/)

          - id: eslint
            name: ESLint staged TypeScript
            entry: npx eslint --fix --max-warnings=0
            language: system
            files: ^(src|tests)/.*\.ts$

          - id: steiger
            name: Steiger FSD architecture
            entry: npm run fsd:fix
            language: system
            pass_filenames: false
            files: ^src/

          - id: ruff
            name: Ruff staged Python
            entry: uv run ruff check --fix --exit-non-zero-on-fix
            language: system
            files: ^scripts/.*\.py$

          - id: ruff-format
            name: Ruff format staged Python
            entry: uv run ruff format
            language: system
            files: ^scripts/.*\.py$

          - id: file-size-baseline
            name: Reduce file-size baseline
            entry: uv run python scripts/quality/check_file_size.py --update-baseline
            language: system
            pass_filenames: false
            files: ^(src|tests|scripts)/.*\.(py|js|jsx|mjs|cjs|ts|tsx|json)$|^quality/file-size-.*\.json$

          - id: clean-index-quality
            name: Full quality gate from prepared index
            entry: uv run python scripts/quality/run_clean_index_quality.py
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-push]
