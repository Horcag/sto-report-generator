name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    workflow-lint:
        name: Workflow lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.25.x'
                  cache: false

            - name: Install actionlint
              run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

            - name: Lint GitHub Actions workflows
              run: actionlint -color

    quality:
        name: Quality gate (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.1.0
              with:
                  enable-cache: true
                  cache-python: true
                  python-version: '3.12'

            - name: Install Node dependencies
              run: npm ci

            - name: Install Python tooling
              run: uv sync --group dev

            - name: Run TypeScript quality gate
              run: npm run ci:check

            - name: Upload JavaScript coverage
              if: ${{ matrix.os == 'ubuntu-latest' }}
              uses: actions/upload-artifact@v7
              with:
                  name: javascript-coverage
                  path: coverage/lcov.info
                  if-no-files-found: error

            - name: Run Python quality gate
              run: npm run python:quality

    sonar:
        name: SonarQube scan
        runs-on: ubuntu-latest
        needs: quality
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download JavaScript coverage
              uses: actions/download-artifact@v8
              with:
                  name: javascript-coverage
                  path: coverage

            - name: SonarQube Scan
              if: ${{ env.SONAR_TOKEN != '' }}
              uses: SonarSource/sonarqube-scan-action@v8
              env:
                  SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
