name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    workflow-lint:
        name: Workflow lint
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: '1.25.x'
                  cache: false

            - name: Install actionlint
              run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

            - name: Lint GitHub Actions workflows
              run: actionlint -color

    quality:
        name: Quality gate (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.1.0
              with:
                  enable-cache: true
                  python-version: '3.12'

            - name: Install Node dependencies
              run: npm ci

            - name: Install Python tooling
              run: uv sync --group dev

            - name: Run TypeScript quality gate
              run: npm run ci:check

            - name: Run Python quality gate
              run: npm run python:quality
